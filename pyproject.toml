[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepthought-rethought"
description = "DeepThought reThought - experimental AI framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Tino Tonitini"}]
urls = {Homepage = "https://github.com/d0tTino/DeepThought-ReThought"}
dynamic = ["version", "dependencies"]

[project.scripts]
dtrt = "deepthought.cli:main"
dtrt-finetune = "deepthought.train:main"

[project.entry-points."deepthought.services"]
demo = "deepthought.services.demo.service:DemoService"
codegen = "deepthought.services.code_generation_service:CodeGenerationService"
memory = "deepthought.services.memory_service:MemoryService"
reward_manager = "deepthought.motivate.reward_manager:RewardManager"
knowledge_graph = "deepthought.services.knowledge_graph_service:KnowledgeGraphService"



[tool.setuptools.package-data]
"deepthought.templates" = [
  "bus_service/*",
  "bus_project/*",
  "reward_service/*",
  "service/*",
]

[tool.setuptools.dynamic]
version = {attr = "deepthought.__init__.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-dir]
"" = "src"
tools = "tools"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["deepthought", "deepthought.*", "tools", "tools.*"]
