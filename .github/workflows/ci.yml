name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'examples/**'
      - '**/*.py'
      - '**/*.cs'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches: ['**']
    tags: ['*']

permissions:
  contents: read

# limit to one concurrent run per branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect_changes:
    runs-on: ["self-hosted", "linux"]
    outputs:
      code_changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          cache: 'pip'
      - id: diff
        env:
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python scripts/check_code_changes.py | tee result.txt
          echo "changed=$(cat result.txt)" >> "$GITHUB_OUTPUT"

  lint_and_unit_tests:
    needs: detect_changes
    if: needs.detect_changes.outputs.code_changed == 'true'
    runs-on: ["self-hosted", "linux"]
    services:
      nats:
        image: nats:latest
        ports:
          - 4222:4222
          - 8222:8222
        options: >-
          --health-cmd "curl -f http://localhost:8222/healthz || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        command: ["-js"]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-ci.txt
      - run: pip install dspy psl deepproblog
      - run: pip install -e . --no-deps
      - name: Run pre-commit
        if: matrix.python-version == '3.11'
        run: pre-commit run --all-files
      - name: Run flake8
        run: flake8 src tests
      - env:
          PYTHONPATH: src
        run: pytest --cov=src --cov-report=xml --cov-fail-under=80 -m "not nats"

      - uses: actions/upload-artifact@v3
        with:
          name: coverage
          path: coverage.xml

  integration_tests:
    needs: lint_and_unit_tests
    if: needs.detect_changes.outputs.code_changed == 'true'
    runs-on: ["self-hosted", "linux"]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Start NATS container
        run: |
          docker run -d --name dtr_nats \
            -p 4222:4222 -p 8222:8222 nats:latest -js
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-ci.txt
      - run: pip install dspy psl deepproblog
      - run: pip install -e . --no-deps
      - name: Setup JetStream
        run: python -c "import asyncio, setup_jetstream; asyncio.run(setup_jetstream.setup_jetstream())"
      - env:
          PYTHONPATH: src
        run: pytest -m "nats"
      - name: Cleanup NATS container
        if: always()
        run: docker rm -f dtr_nats

  memgraph_tests:
    needs: integration_tests
    if: needs.detect_changes.outputs.code_changed == 'true'
    runs-on: ["self-hosted", "linux"]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Start Memgraph container
        run: docker run -d --name dtr_memgraph -p 7687:7687 memgraph/memgraph
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-ci.txt
      - run: pip install dspy psl deepproblog
      - run: pip install -e . --no-deps
      - env:
          PYTHONPATH: src
        run: pytest -m memgraph
      - name: Cleanup Memgraph container
        if: always()
        run: docker rm -f dtr_memgraph

  docker_finetune_image:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v3
      - name: Build finetune image
        run: docker build -f docker/Dockerfile.finetune -t dtrt-finetune .

  docker_images_on_push:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        image:
          - edge
          - finetune
    steps:
      - uses: actions/checkout@v3
      - name: Build ${{ matrix.image }} image
        run: docker build -f docker/Dockerfile.${{ matrix.image }} -t dtrt-${{ matrix.image }} .
