name: Build and Push Docker Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - '.github/workflows/docker_publish.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build finetune image
        run: docker build -f docker/Dockerfile.finetune -t ghcr.io/${{ github.repository_owner }}/dtrt-finetune .
      - name: Build edge image
        run: docker build -f docker/Dockerfile.edge -t ghcr.io/${{ github.repository_owner }}/dtrt-edge .
      - name: Push finetune image
        run: docker push ghcr.io/${{ github.repository_owner }}/dtrt-finetune
      - name: Push edge image
        run: docker push ghcr.io/${{ github.repository_owner }}/dtrt-edge
